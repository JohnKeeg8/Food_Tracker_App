services:
  app:
    build: .
    container_name: health-tracker
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Everything (all users' logs, recipes, goals) lives in ./data/health.db on this server.
      - ./data:/data

  # Optional HTTPS front end so phones can use the live barcode camera.
  # Start it with:  docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
